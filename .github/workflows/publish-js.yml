name: JavaScript parser publish

on:
  workflow_dispatch:
    inputs:
      release:
        description: 'next cuts a prerelease under the next dist-tag; patch, minor and major cut a release under latest'
        required: true
        default: next
        type: choice
        options:
          - next
          - patch
          - minor
          - major

jobs:
  tests:
    uses: ./.github/workflows/tests.yml
    with:
      package: js

  publish:
    needs: tests
    uses: ./.github/workflows/publish.yml
    permissions:
      contents: read
      id-token: write
    with:
      package: js
      release: ${{ inputs.release }}
    secrets:
      APP_PRIVATE_KEY: ${{ secrets.APP_PRIVATE_KEY }}
