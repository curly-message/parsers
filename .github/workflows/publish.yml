name: Publish

on:
  workflow_call:
    inputs:
      package:
        description: 'Package directory to publish'
        required: true
        type: string
      release:
        description: 'next (a prerelease under the next dist-tag), patch, minor or major'
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true

# A release runs in three jobs, so that no code a dependency ships runs where
# the release's credentials are: `version` settles what is released, `build`
# installs and builds with no credential that can push or publish, and
# `release` holds the App's key and the right to publish and takes the build
# as files. Of the three, only `build` runs a dependency's code.
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      section: ${{ steps.version.outputs.section }}
      patch: ${{ steps.bump.outputs.patch }}
      changes: ${{ steps.bump.outputs.changes }}

    steps:
      - name: Refuse anything but main
        working-directory: .
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::A release is cut from main only, not from $GITHUB_REF_NAME."; exit 1; }

      # No credential stays in a checkout for what runs after it to read.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # The registry registers a trusted publisher only for a package that
      # exists, so the first version is published by hand (see the README).
      - name: Check the package is on the registry
        run: |
          name=$(node -p "require('./package.json').name")
          npm view "$name" name > /dev/null || { echo "::error::$name is not on the registry. Publish the first version by hand, register this workflow as its trusted publisher, then run again."; exit 1; }

      # The changelog's pending section names the version it will be released
      # as, so a version is settled in the commit that writes the section
      # rather than in the dispatch. `patch`, `minor` and `major` cut that
      # section under the `latest` dist-tag and must arrive at the version it
      # names, which over an open prerelease line is the bump that drops the
      # prerelease rather than the one that opened it (1.1.0-next.3 reaches
      # 1.1.0 under `patch`). `next` publishes a prerelease of that version
      # (1.1.0-next.0,
      # then .1) under the `next` dist-tag and leaves the section open, because
      # a prerelease has not released what the section names.
      - name: Bump the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          case "$RELEASE" in
            next) tag=next ;;
            patch|minor|major) tag=latest ;;
            *) echo "::error::Unknown release type '$RELEASE'; expected next, patch, minor or major."; exit 1 ;;
          esac
          # One spelling of the heading, read by the gate, by the version it
          # names and by the rewrite: a widening one of them missed would pass
          # one and not the others.
          heading='### ([0-9]+\.[0-9]+\.[0-9]+) \(Unreleased\)'
          sections=$(grep -cE "^$heading$" CHANGELOG.md) || sections=0
          [ "$sections" = 1 ] || { echo "::error::CHANGELOG.md holds $sections sections headed '### <major.minor.patch> (Unreleased)'; a release reads exactly one."; exit 1; }
          declared=$(sed -nE "s/^$heading$/\1/p" CHANGELOG.md)
          before=$(node -p "require('./package.json').version")
          if [ "$tag" = next ]; then
            case "$before" in
              "$declared"-next.*) npm version prerelease --preid=next --no-git-tag-version ;;
              *) npm version "$declared-next.0" --no-git-tag-version ;;
            esac
          else
            npm version "$RELEASE" --no-git-tag-version
          fi
          # Read back from package.json: a version script prints while npm version runs.
          version=$(node -p "require('./package.json').version")
          section="### $declared (Unreleased)"
          if [ "$tag" = latest ]; then
            [ "$version" = "$declared" ] || { echo "::error::$RELEASE over $before is $version, and CHANGELOG.md's pending section names $declared. Release what the section names, or rewrite its heading."; exit 1; }
            sed -i -E "s/^$heading$/## \1/" CHANGELOG.md
            section="## $version"
          fi
          echo "name=$(node -p "require('./package.json').name")" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "section=$section" >> "$GITHUB_OUTPUT"

      # The other jobs check out the same commit and apply the bump as this
      # patch, held to the files it changed here.
      - name: Record the bump
        id: bump
        working-directory: .
        run: |
          echo "patch=$(git diff --binary | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "changes=$(git status --porcelain | cut -c4- | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: ${{ inputs.package }}
    outputs:
      integrity: ${{ steps.pack.outputs.integrity }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # From the root: run in a subdirectory, git apply drops every path
      # outside it without a word.
      - name: Apply the bump
        working-directory: .
        env:
          PATCH: ${{ needs.version.outputs.patch }}
          CHANGES: ${{ needs.version.outputs.changes }}
        run: |
          base64 -d <<< "$PATCH" | git apply
          changes=$(git status --porcelain | cut -c4- | paste -sd ' ' -)
          [ "$changes" = "$CHANGES" ] || { echo "::error::The bump changes '$changes' here and changed '$CHANGES' where it was made."; exit 1; }

      # No install script runs: the build needs none, and what this job builds
      # is what is published.
      - name: Install dependencies
        run: npm ci --ignore-scripts

      # Each release records what its build costs, measured on the runner that
      # builds it; a row that fails stops the release here.
      - name: Benchmark
        run: |
          npm run build
          node bench/harness.mjs > BENCH.md

      # One tar file rather than the artifact's own zip, which drops each
      # file's mode, a bin's executable bit among them. The integrity is what
      # the release job has to pack from it.
      - name: Pack the build
        id: pack
        run: |
          tar -cf "$RUNNER_TEMP/build.tar" dist BENCH.md
          integrity=$(npm pack --dry-run --json --ignore-scripts | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].integrity")
          echo "integrity=$integrity" >> "$GITHUB_OUTPUT"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/build.tar
          archive: false
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    concurrency: publish-${{ inputs.package }}
    permissions:
      contents: read
      id-token: write # npm trusted publishing
    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - name: Apply the bump
        working-directory: .
        env:
          PATCH: ${{ needs.version.outputs.patch }}
          CHANGES: ${{ needs.version.outputs.changes }}
        run: |
          base64 -d <<< "$PATCH" | git apply
          changes=$(git status --porcelain | cut -c4- | paste -sd ' ' -)
          [ "$changes" = "$CHANGES" ] || { echo "::error::The bump changes '$changes' here and changed '$CHANGES' where it was made."; exit 1; }

      # The build job chooses how its upload is sent, and one sent as a zip
      # would be unpacked over the files this job keeps in its temporary
      # directory, npm's config among them. So it lands in a directory of its
      # own, unpacked by nothing but the tar below.
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build.tar
          path: ${{ runner.temp }}/artifact
          skip-decompress: true

      # Only the build is taken from it, and only as files and directories, so
      # nothing else it carries lands where npm or git would read it.
      - name: Take the build
        env:
          INTEGRITY: ${{ needs.build.outputs.integrity }}
        run: |
          mkdir "$RUNNER_TEMP/build"
          tar -xf "$RUNNER_TEMP/artifact/build.tar" -C "$RUNNER_TEMP/build"
          # On its own, so that a find which cannot read the build fails the step.
          others=$(find "$RUNNER_TEMP/build" ! -type f ! -type d)
          [ -d "$RUNNER_TEMP/build/dist" ] && [ -f "$RUNNER_TEMP/build/BENCH.md" ] && [ -z "$others" ] || { echo "::error::The build is to hold a dist directory and a BENCH.md file, and nothing but files and directories."; exit 1; }
          cp -a "$RUNNER_TEMP/build/dist" "$RUNNER_TEMP/build/BENCH.md" .
          git add BENCH.md
          integrity=$(npm pack --dry-run --json --ignore-scripts | node -p "JSON.parse(require('fs').readFileSync(0, 'utf8'))[0].integrity")
          [ "$integrity" = "$INTEGRITY" ] || { echo "::error::The package packs as $integrity here and packed as $INTEGRITY where it was built."; exit 1; }

      # The release commit, its tag and the GitHub release are the app's: its
      # token passes the rules on main, and unlike the workflow's own token, a
      # push made with it starts the workflows that watch the branch.
      - name: Mint the release token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # One atomic push carries the commit and the tag: either both land or
      # neither, and --follow-tags would have left a lightweight tag behind.
      # The token reaches git through the environment of this step alone.
      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          PACKAGE: ${{ inputs.package }}
          NAME: ${{ needs.version.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          id=$(gh api "/users/$APP[bot]" --jq .id)
          git config user.name "$APP[bot]"
          git config user.email "$id+$APP[bot]@users.noreply.github.com"
          git commit --all --message "chore($PACKAGE): release $NAME@$VERSION"
          git tag --annotate --message "$NAME@$VERSION" "$PACKAGE-v$VERSION"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git push --atomic origin main "$PACKAGE-v$VERSION"

      # No token: the registry trusts the calling workflow's OIDC identity (the
      # package's trusted publisher names its filename) and adds provenance.
      # What it packs is the build taken above.
      - name: Publish to npm
        env:
          TAG: ${{ needs.version.outputs.tag }}
        run: npm publish --ignore-scripts --access public --tag "$TAG"

      # The release notes are the changelog section this release names: the one
      # just cut, or, for a prerelease, the pending one it leaves open.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          NAME: ${{ needs.version.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SECTION: ${{ needs.version.outputs.section }}
        run: |
          awk -v heading="$SECTION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ "$TAG" = next ] && prerelease=--prerelease || prerelease=
          gh release create "$PACKAGE-v$VERSION" --verify-tag --title "$NAME@$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
