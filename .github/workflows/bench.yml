name: Benchmark

# The benchmark of a PR against its base, posted on the PR and in the job's
# summary, for each package the PR touches: each directory that holds a
# `bench/rows.mjs` on the branch, or on the base where the branch still holds
# more of it than documents and tests. It fails where the branch dropped the
# package's benchmark, and where the benchmark fails: a row of the branch
# that fails, or, unless the PR carries the `bench-accepted` label, a count
# that grew, a row gone missing or changing kind, or a row that fails on the
# base. The base is compared only where its commit has the package's
# `bench/rows.mjs`; where it has none, as for the PR that adds the package or
# its benchmark, or one that renames its directory, nothing is compared, and
# only the branch's own benchmark can fail the job. `bench-label.yml` re-runs
# it when that label changes.
on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!**/tests/**'
      - .github/workflows/bench.yml

permissions:
  contents: read
  pull-requests: write

# A push supersedes the run of the one before it, so the comment shows the
# head's table.
concurrency:
  group: bench-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  # The packages the PR touches: those with a changed file that is neither a
  # document nor a test, or every package where this workflow changed. Read
  # from the base as well as the branch, so a PR that deletes a package's rows
  # still benchmarks it, and fails. Each tree is read unpiped, so a git that
  # fails fails the step.
  packages:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
    outputs:
      list: ${{ steps.list.outputs.list }}

    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7
        with:
          path: change
          persist-credentials: false

      - name: Checkout the base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      - name: List the packages
        id: list
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          branch=$(git -C change ls-files)
          base=$(git -C base ls-tree -r --name-only "$BASE_SHA")
          changed=$(gh api --paginate "repos/$GITHUB_REPOSITORY/pulls/$PR/files" --jq '.[] | .filename, (.previous_filename // empty)')
          all=0
          if grep -qxF '.github/workflows/bench.yml' <<< "$changed"; then all=1; fi
          list=$(awk -v all="$all" '
            # Whether the change filter counts a file for the package in dir.
            function counts(file, dir) {
              return index(file, dir "/") == 1 && file !~ /\.md$/ && index(file, dir "/tests/") != 1
            }
            # The package whose rows a file is, or "" where it is none.
            function package(file) {
              if (file !~ /\/bench\/rows\.mjs$/ || file ~ /\/bench\/check\//) return ""
              sub(/\/bench\/rows\.mjs$/, "", file)
              return file
            }
            function list(dir) { listed[dir] = 1; packages[++m] = dir }
            FILENAME == ARGV[1] { changed[++n] = $0; next }
            FILENAME == ARGV[2] {
              held[++h] = $0
              if ((dir = package($0)) != "" && !(dir in listed)) list(dir)
              next
            }
            (dir = package($0)) != "" && !(dir in listed) {
              for (i = 1; i <= h; i++) if (counts(held[i], dir)) { list(dir); break }
            }
            END {
              for (j = 1; j <= m; j++) for (i = 1; i <= n; i++) if (all || counts(changed[i], packages[j])) { print packages[j]; break }
            }
          ' <(printf '%s\n' "$changed") <(printf '%s\n' "$branch") <(printf '%s\n' "$base") | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "Packages: $list"
          echo "list=$list" >> "$GITHUB_OUTPUT"

  Benchmark:
    needs: packages
    if: needs.packages.outputs.list != '[]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        package: ${{ fromJSON(needs.packages.outputs.list) }}

    steps:
      - name: Checkout the branch
        uses: actions/checkout@v7
        with:
          path: change
          persist-credentials: false

      # A package listed from the base whose branch dropped its benchmark
      # fails here, naming what is missing, rather than in a step that needs it.
      - name: Check the benchmark is there
        env:
          PACKAGE: ${{ matrix.package }}
        run: |
          missing=0
          for file in bench/rows.mjs bench/harness.mjs bench/check/check.mjs; do
            if [ ! -f "change/$PACKAGE/$file" ]; then
              echo "::error::The branch has no $PACKAGE/$file."
              missing=1
            fi
          done
          exit "$missing"

      - name: Checkout the base
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: base
          persist-credentials: false

      # The harness is Node's, whatever the package is written in.
      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      # A toolchain per manifest the package holds. Rust needs no step: the
      # runner's rustup honours the package's `rust-toolchain.toml`.
      - name: Setup uv
        if: hashFiles(format('change/{0}/pyproject.toml', matrix.package)) != ''
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Setup Go
        if: hashFiles(format('change/{0}/go.mod', matrix.package)) != ''
        uses: actions/setup-go@v7
        with:
          go-version-file: change/${{ matrix.package }}/go.mod
          cache: false

      - name: Setup PHP
        if: hashFiles(format('change/{0}/composer.json', matrix.package)) != ''
        uses: shivammathur/setup-php@v2
        with:
          php-version-file: change/${{ matrix.package }}/.php-version
          extensions: intl, opcache
          coverage: none

      # The harness on rows that fail wherever two measurements share a
      # process, with a base and without, so a table below is one whose sides
      # were measured apart and whose base was read as given.
      - name: Check the harness
        timeout-minutes: 5
        working-directory: change/${{ matrix.package }}/bench/check
        run: node check.mjs

      # Read from the base's commit rather than from what its checkout holds,
      # so a path given wrong fails the harness instead of comparing nothing.
      # The substitution is unpiped, so a git that fails fails the step.
      - name: Read whether the base has a benchmark
        id: base
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PACKAGE: ${{ matrix.package }}
        run: |
          rows=$(git -C base ls-tree --name-only "$BASE_SHA" -- "$PACKAGE/bench/rows.mjs")
          if [ -n "$rows" ]; then holds=true; else holds=false; fi
          echo "holds=$holds" >> "$GITHUB_OUTPUT"

      # Each side by its `bench/prepare.sh`, or else from its lockfile with
      # npm. Neither runs a dependency's install script where its toolchain
      # lets it refuse one, since the job holds a token that writes to the PR.
      # A base that does not build leaves rows that fail, which the label can
      # accept; a base without a benchmark is not prepared.
      - name: Install and build
        env:
          HOLDS: ${{ steps.base.outputs.holds }}
          PACKAGE: ${{ matrix.package }}
        run: |
          prepare() {
            if [ -f bench/prepare.sh ]; then
              sh bench/prepare.sh
            else
              npm ci --ignore-scripts && npm run build
            fi
          }
          if [ "$HOLDS" = true ]; then
            (cd "base/$PACKAGE" && prepare) || echo "::warning::The base did not install or build."
          else
            echo "::notice::The base has no benchmark of $PACKAGE."
          fi
          (cd "change/$PACKAGE" && prepare)

      # Read when the job runs rather than off the event, so a re-run sees a
      # label added since.
      - name: Read the labels
        id: labels
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: echo "accepted=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/labels" --jq 'any(.[]; .name == "bench-accepted")')" >> "$GITHUB_OUTPUT"

      # The base by an absolute path, which holds for a package nested at any
      # depth.
      - name: Benchmark
        id: bench
        working-directory: change/${{ matrix.package }}
        env:
          ACCEPTED: ${{ steps.labels.outputs.accepted }}
          HOLDS: ${{ steps.base.outputs.holds }}
          PACKAGE: ${{ matrix.package }}
        run: |
          flags=()
          if [ "$HOLDS" = true ]; then flags+=(--compare "$GITHUB_WORKSPACE/base/$PACKAGE"); fi
          if [ "$ACCEPTED" = true ]; then flags+=(--accepted); fi
          status=0
          node bench/harness.mjs "${flags[@]}" > "$RUNNER_TEMP/bench.md" || status=$?
          cat "$RUNNER_TEMP/bench.md" >> "$GITHUB_STEP_SUMMARY"
          echo "status=$status" >> "$GITHUB_OUTPUT"

      # One comment per package, the bot's own, edited by each run. A PR from a
      # fork gets a token that cannot comment; its table is in the job's
      # summary.
      - name: Comment on the PR
        if: github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          HEAD: ${{ github.event.pull_request.head.sha }}
          PACKAGE: ${{ matrix.package }}
        run: |
          marker="<!-- bench:$PACKAGE -->"
          body="$marker"$'\n'"$(cat "$RUNNER_TEMP/bench.md")"$'\n\n'"Measured on $HEAD."
          id=$(gh api --paginate "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n 1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -f body="$body" > /dev/null
          else
            gh api --method POST "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -f body="$body" > /dev/null
          fi

      - name: Fail where the benchmark failed
        if: steps.bench.outputs.status != '0'
        run: exit 1
