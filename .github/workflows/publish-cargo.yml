name: Publish a crate

on:
  workflow_call:
    inputs:
      package:
        description: 'Cargo workspace directory whose root package is published'
        required: true
        type: string
      release:
        description: 'next (a prerelease of the pending version), patch, minor or major'
        required: true
        type: string
    secrets:
      APP_PRIVATE_KEY:
        required: true

# A release runs in three jobs, so that no code a dependency ships runs where
# the release's credentials are: `version` settles what is released, `build`
# builds, benchmarks and verifies the package with no credential that can
# push or publish, and `release` holds the App's key and the right to publish
# and takes the build as files. Of the three, only `build` runs a dependency's
# code.
jobs:
  version:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.package }}
    outputs:
      name: ${{ steps.version.outputs.name }}
      version: ${{ steps.version.outputs.version }}
      tag: ${{ steps.version.outputs.tag }}
      section: ${{ steps.version.outputs.section }}
      patch: ${{ steps.bump.outputs.patch }}
      changes: ${{ steps.bump.outputs.changes }}

    steps:
      - name: Refuse anything but main
        working-directory: .
        run: |
          [ "$GITHUB_REF" = refs/heads/main ] || { echo "::error::A release is cut from main only, not from $GITHUB_REF_NAME."; exit 1; }

      # No credential stays in a checkout for what runs after it to read.
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      # crates.io registers a trusted publisher only for a crate that exists,
      # so the first version is published by hand (see the README).
      - name: Check the crate is on the registry
        run: |
          name=$(sed -nE '/^\[package\]$/,/^\[/ s/^name = "([^"]+)"$/\1/p' Cargo.toml)
          curl -fsS -o /dev/null -A curly-message-release "https://crates.io/api/v1/crates/$name" || { echo "::error::$name is not on crates.io. Publish the first version by hand, register this workflow as its trusted publisher, then run again."; exit 1; }

      # The changelog's pending section names the version it will be released
      # as, so a version is settled in the commit that writes the section
      # rather than in the dispatch. `patch`, `minor` and `major` cut that
      # section and must arrive at the version it names, which over an open
      # prerelease line is the bump that drops the prerelease rather than the
      # one that opened it (1.1.0-next.3 reaches 1.1.0 under `patch`), as npm
      # bumps one. `next` publishes a prerelease of that version
      # (1.1.0-next.0, then .1), which Cargo resolves only for a requirement
      # naming a prerelease, and leaves the section open, because a
      # prerelease has not released what the section names. The bump is
      # written into the manifest and the lockfile by hand: nothing here runs
      # cargo, which would read the workspace's dependencies.
      - name: Bump the version
        id: version
        env:
          RELEASE: ${{ inputs.release }}
        run: |
          case "$RELEASE" in
            next) tag=next ;;
            patch|minor|major) tag=latest ;;
            *) echo "::error::Unknown release type '$RELEASE'; expected next, patch, minor or major."; exit 1 ;;
          esac
          # One spelling of the heading, read by the gate, by the version it
          # names and by the rewrite: a widening one of them missed would pass
          # one and not the others.
          heading='### ([0-9]+\.[0-9]+\.[0-9]+) \(Unreleased\)'
          sections=$(grep -cE "^$heading$" CHANGELOG.md) || sections=0
          [ "$sections" = 1 ] || { echo "::error::CHANGELOG.md holds $sections sections headed '### <major.minor.patch> (Unreleased)'; a release reads exactly one."; exit 1; }
          declared=$(sed -nE "s/^$heading$/\1/p" CHANGELOG.md)
          name=$(sed -nE '/^\[package\]$/,/^\[/ s/^name = "([^"]+)"$/\1/p' Cargo.toml)
          before=$(sed -nE '/^\[package\]$/,/^\[/ s/^version = "([^"]+)"$/\1/p' Cargo.toml)
          [[ "$before" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)(-(.+))?$ ]] || { echo "::error::Cargo.toml's version '$before' is not major.minor.patch with an optional prerelease."; exit 1; }
          major=${BASH_REMATCH[1]} minor=${BASH_REMATCH[2]} patch=${BASH_REMATCH[3]} pre=${BASH_REMATCH[5]}
          case "$RELEASE" in
            next)
              if [[ "$before" =~ ^"$declared"-next\.([0-9]+)$ ]]; then
                version="$declared-next.$((BASH_REMATCH[1] + 1))"
              else
                version="$declared-next.0"
              fi ;;
            patch)
              [ -n "$pre" ] && version="$major.$minor.$patch" || version="$major.$minor.$((patch + 1))" ;;
            minor)
              [ -n "$pre" ] && [ "$patch" = 0 ] && version="$major.$minor.0" || version="$major.$((minor + 1)).0" ;;
            major)
              [ -n "$pre" ] && [ "$minor" = 0 ] && [ "$patch" = 0 ] && version="$major.0.0" || version="$((major + 1)).0.0" ;;
          esac
          section="### $declared (Unreleased)"
          if [ "$tag" = latest ]; then
            [ "$version" = "$declared" ] || { echo "::error::$RELEASE over $before is $version, and CHANGELOG.md's pending section names $declared. Release what the section names, or rewrite its heading."; exit 1; }
            sed -i -E "s/^$heading$/## \1/" CHANGELOG.md
            section="## $version"
          fi
          sed -i -E "/^\[package\]$/,/^\[/ s/^version = \"[^\"]+\"$/version = \"$version\"/" Cargo.toml
          sed -i -E "/^name = \"$name\"$/{n;s/^version = \"[^\"]+\"$/version = \"$version\"/}" Cargo.lock
          # Each rewrite reaches exactly the one line it is for.
          for file in Cargo.toml Cargo.lock; do
            [ "$(git diff --numstat -- "$file" | cut -f1,2)" = "$(printf '1\t1')" ] || { echo "::error::The bump to $version is to change one line of $file."; exit 1; }
          done
          echo "name=$name" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "section=$section" >> "$GITHUB_OUTPUT"

      # The other jobs check out the same commit and apply the bump as this
      # patch, held to the files it changed here.
      - name: Record the bump
        id: bump
        working-directory: .
        run: |
          echo "patch=$(git diff --binary | base64 -w0)" >> "$GITHUB_OUTPUT"
          echo "changes=$(git status --porcelain | cut -c4- | paste -sd ' ' -)" >> "$GITHUB_OUTPUT"

  build:
    needs: version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.package }}
    outputs:
      digest: ${{ steps.package.outputs.digest }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      # From the root: run in a subdirectory, git apply drops every path
      # outside it without a word.
      - name: Apply the bump
        working-directory: .
        env:
          PATCH: ${{ needs.version.outputs.patch }}
          CHANGES: ${{ needs.version.outputs.changes }}
        run: |
          base64 -d <<< "$PATCH" | git apply
          changes=$(git status --porcelain | cut -c4- | paste -sd ' ' -)
          [ "$changes" = "$CHANGES" ] || { echo "::error::The bump changes '$changes' here and changed '$CHANGES' where it was made."; exit 1; }

      - name: Build
        env:
          NAME: ${{ needs.version.outputs.name }}
        run: cargo build --locked -p "$NAME"

      # Each release records what its build costs, measured on the runner that
      # builds it; a row that fails stops the release here.
      - name: Benchmark
        run: |
          sh bench/prepare.sh
          node bench/harness.mjs > BENCH.md

      # `cargo package` verifies the crate by building it from the files it
      # ships. The digest covers each of them but `.cargo_vcs_info.json`,
      # which names a commit the release has yet to make; it is what the
      # release job has to package. One tar file rather than the artifact's
      # own zip, which drops each file's mode.
      - name: Package
        id: package
        env:
          NAME: ${{ needs.version.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          cargo package --locked --allow-dirty -p "$NAME"
          target=$(cargo metadata --format-version 1 --no-deps --locked | jq -r .target_directory)
          crate="$target/package/$NAME-$VERSION.crate"
          unpacked=$(mktemp -d)
          tar -xzf "$crate" -C "$unpacked"
          digest=$(cd "$unpacked" && find . -type f ! -name .cargo_vcs_info.json -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          echo "digest=$digest" >> "$GITHUB_OUTPUT"
          cp "$crate" "$RUNNER_TEMP/$NAME.crate"
          tar -cf "$RUNNER_TEMP/build.tar" BENCH.md -C "$RUNNER_TEMP" "$NAME.crate"

      - name: Upload the build
        uses: actions/upload-artifact@v7
        with:
          path: ${{ runner.temp }}/build.tar
          archive: false
          if-no-files-found: error

  release:
    needs: [version, build]
    runs-on: ubuntu-latest
    environment: release
    concurrency: publish-${{ inputs.package }}
    permissions:
      contents: read
      id-token: write # crates.io trusted publishing
    defaults:
      run:
        shell: bash
        working-directory: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Rust
        run: |
          rustup toolchain install stable --profile minimal --no-self-update
          rustup default stable

      - name: Apply the bump
        working-directory: .
        env:
          PATCH: ${{ needs.version.outputs.patch }}
          CHANGES: ${{ needs.version.outputs.changes }}
        run: |
          base64 -d <<< "$PATCH" | git apply
          changes=$(git status --porcelain | cut -c4- | paste -sd ' ' -)
          [ "$changes" = "$CHANGES" ] || { echo "::error::The bump changes '$changes' here and changed '$CHANGES' where it was made."; exit 1; }

      # The build job chooses how its upload is sent, and one sent as a zip
      # would be unpacked over the files this job keeps in its temporary
      # directory. So it lands in a directory of its own, unpacked by nothing
      # but the tar below.
      - name: Download the build
        uses: actions/download-artifact@v8
        with:
          name: build.tar
          path: ${{ runner.temp }}/artifact
          skip-decompress: true

      # Only BENCH.md is taken from it, and only as a file, so nothing else it
      # carries lands where cargo or git would read it. The crate is published
      # as packaged here, without building it again, and is held to the one
      # the build job verified, file by file.
      - name: Take the build
        env:
          NAME: ${{ needs.version.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
          DIGEST: ${{ needs.build.outputs.digest }}
        run: |
          mkdir "$RUNNER_TEMP/build"
          tar -xf "$RUNNER_TEMP/artifact/build.tar" -C "$RUNNER_TEMP/build"
          # On its own, so that a find which cannot read the build fails the step.
          others=$(find "$RUNNER_TEMP/build" ! -type f ! -type d)
          [ -f "$RUNNER_TEMP/build/BENCH.md" ] && [ -f "$RUNNER_TEMP/build/$NAME.crate" ] && [ -z "$others" ] || { echo "::error::The build is to hold a BENCH.md file and $NAME.crate, and nothing but files and directories."; exit 1; }
          cp "$RUNNER_TEMP/build/BENCH.md" .
          git add BENCH.md
          digest() {
            local unpacked
            unpacked=$(mktemp -d)
            tar -xzf "$1" -C "$unpacked"
            (cd "$unpacked" && find . -type f ! -name .cargo_vcs_info.json -print0 | LC_ALL=C sort -z | xargs -0 sha256sum | sha256sum | cut -d' ' -f1)
          }
          built=$(digest "$RUNNER_TEMP/build/$NAME.crate")
          [ "$built" = "$DIGEST" ] || { echo "::error::The crate uploaded digests as $built, and the build job packaged $DIGEST."; exit 1; }
          cargo package --no-verify --locked --allow-dirty -p "$NAME"
          target=$(cargo metadata --format-version 1 --no-deps --locked | jq -r .target_directory)
          here=$(digest "$target/package/$NAME-$VERSION.crate")
          [ "$here" = "$DIGEST" ] || { echo "::error::The crate packages as $here here and packaged as $DIGEST where it was built."; exit 1; }

      # The release commit, its tag and the GitHub release are the app's: its
      # token passes the rules on main, and unlike the workflow's own token, a
      # push made with it starts the workflows that watch the branch.
      - name: Mint the release token
        id: app
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.APP_CLIENT_ID }}
          private-key: ${{ secrets.APP_PRIVATE_KEY }}
          permission-contents: write

      # One atomic push carries the commit and the tag: either both land or
      # neither, and --follow-tags would have left a lightweight tag behind.
      # The token reaches git through the environment of this step alone.
      - name: Commit, tag and push
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          APP: ${{ steps.app.outputs.app-slug }}
          PACKAGE: ${{ inputs.package }}
          NAME: ${{ needs.version.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          id=$(gh api "/users/$APP[bot]" --jq .id)
          git config user.name "$APP[bot]"
          git config user.email "$id+$APP[bot]@users.noreply.github.com"
          git commit --all --message "chore($PACKAGE): release $NAME@$VERSION"
          git tag --annotate --message "$NAME@$VERSION" "$PACKAGE-v$VERSION"
          export GIT_CONFIG_COUNT=1 GIT_CONFIG_KEY_0=http.https://github.com/.extraheader
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $(printf 'x-access-token:%s' "$GH_TOKEN" | base64 -w0)"
          export GIT_CONFIG_VALUE_0
          git push --atomic origin main "$PACKAGE-v$VERSION"

      # No stored token: crates.io trusts the dispatched workflow's OIDC
      # identity (the crate's trusted publisher names its filename and this
      # environment) and hands back a token that the action revokes once the
      # job ends.
      - name: Authenticate to crates.io
        id: crates-io
        uses: rust-lang/crates-io-auth-action@v1

      # After the commit, on a clean tree, so the crate records the release
      # commit. What it packages is what was held to the build above.
      - name: Publish to crates.io
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.crates-io.outputs.token }}
          NAME: ${{ needs.version.outputs.name }}
        run: cargo publish --no-verify --locked -p "$NAME"

      # The release notes are the changelog section this release names: the one
      # just cut, or, for a prerelease, the pending one it leaves open.
      - name: Publish the GitHub release
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          PACKAGE: ${{ inputs.package }}
          NAME: ${{ needs.version.outputs.name }}
          VERSION: ${{ needs.version.outputs.version }}
          TAG: ${{ needs.version.outputs.tag }}
          SECTION: ${{ needs.version.outputs.section }}
        run: |
          awk -v heading="$SECTION" '$0 == heading { on = 1; next } /^## / { on = 0 } on' CHANGELOG.md > "$RUNNER_TEMP/notes.md"
          [ "$TAG" = next ] && prerelease=--prerelease || prerelease=
          gh release create "$PACKAGE-v$VERSION" --verify-tag --title "$NAME@$VERSION" --notes-file "$RUNNER_TEMP/notes.md" $prerelease
