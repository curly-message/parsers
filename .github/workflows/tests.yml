name: Tests

on:
  workflow_call:
    inputs:
      package:
        description: 'Package directory to test'
        required: true
        type: string

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Before the tests build anything: a fresh checkout carries no build
      # output, so what the tarball holds is what packing produced. The listing
      # is read whole before it is searched: a search that stops at its first
      # hit leaves the lister writing into a closed pipe, and `pipefail` counts
      # that as a failure.
      - name: Pack
        shell: bash
        run: |
          npm pack > /dev/null
          packed=$(tar -tzf ./*.tgz)
          for file in dist/index.js dist/index.d.ts; do grep -qx "package/$file" <<< "$packed"; done
          rm ./*.tgz

      - name: Test
        run: npm run test

  # The source touches no API one runtime has and another lacks; the suite on
  # each runtime is what keeps that true. npm installs and builds, and the
  # runtime under test runs vitest.
  Runtimes:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        runtime: [bun, deno]
    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Setup Bun
        if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2

      - name: Setup Deno
        if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Install dependencies
        run: npm ci

      - name: Test
        run: npm run test:${{ matrix.runtime }}
