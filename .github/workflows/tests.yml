name: Tests

on:
  workflow_call:
    inputs:
      package:
        description: 'Package directory to test'
        required: true
        type: string

jobs:
  Tests:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        node-version: [22, 24]
        os: [ubuntu-latest, windows-latest, macOS-latest]
    defaults:
      run:
        working-directory: ${{ inputs.package }}

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install dependencies
        run: npm ci

      # Before the tests build anything: a fresh checkout carries no build
      # output, so what the tarball holds is what packing produced. The listing
      # is read whole before it is searched: a search that stops at its first
      # hit leaves the lister writing into a closed pipe, and `pipefail` counts
      # that as a failure.
      - name: Pack
        shell: bash
        run: |
          npm pack > /dev/null
          packed=$(tar -tzf ./*.tgz)
          for file in dist/index.js dist/index.d.ts; do grep -qx "package/$file" <<< "$packed"; done
          rm ./*.tgz

      - name: Test
        run: npm run test
