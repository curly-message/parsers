name: Re-run unplaced jobs

# GitHub sometimes never places a job on a hosted runner, macOS above all: the
# job ends cancelled with no runner and no step, and fails a run no test
# failed. This re-runs the failed jobs of such a run once, and leaves alone a
# run with any job that ran and did not succeed. It checks out nothing and
# runs nothing of the run it reads.
on:
  workflow_run:
    workflows:
      - JavaScript parser tests
      - Go parser tests
      - Rust parser tests
      - Python parser tests
      - PHP parser tests
    types: [completed]

permissions:
  actions: write

jobs:
  Rerun:
    # A first attempt only, so a re-run that fails again stays failed.
    if: github.event.workflow_run.conclusion == 'failure' && github.event.workflow_run.run_attempt == 1
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        shell: bash

    steps:
      - name: Re-run the jobs no runner took
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
        run: |
          # The run is read as it is now: someone may have re-run it already.
          attempt=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs/$RUN" --jq .run_attempt)
          if [ "$attempt" != 1 ]; then
            echo "The run is on attempt $attempt already."
            exit 0
          fi
          # Every job that neither succeeded nor was skipped must have had no
          # runner and no step; a skipped job has neither either, and counts
          # for nothing.
          verdict=$(gh api --paginate "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/attempts/1/jobs?per_page=100" --jq '.jobs[]' | jq -rs '
            [.[] | select(.conclusion != "success" and .conclusion != "skipped" and .conclusion != "neutral")]
            | if length == 0 then "none"
              elif all(((.runner_id // 0) == 0) and ((.steps // []) | length) == 0) then "unplaced"
              else "ran" end')
          case "$verdict" in
            unplaced)
              gh api --method POST "repos/$GITHUB_REPOSITORY/actions/runs/$RUN/rerun-failed-jobs" > /dev/null
              echo "Re-ran the failed jobs of run $RUN, none of which a runner took." ;;
            none)
              echo "Run $RUN has no failed job to re-run." ;;
            *)
              echo "Run $RUN has a job that ran and failed; it is left as it is." ;;
          esac
