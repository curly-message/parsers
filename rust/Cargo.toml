[package]
name = "curly-message-parser"
version = "1.0.0-next.0"
edition = "2024"
rust-version = "1.88"
description = "Rust implementation of the Curly Message Format."
license = "MIT"
repository = "https://github.com/curly-message/parsers"
homepage = "https://curlymessage.dev/"
readme = "README.md"
keywords = ["curly-message", "i18n", "internationalization", "translation", "interpolation"]
categories = ["internationalization", "localization", "template-engine"]
include = ["src/**", "README.md", "CHANGELOG.md", "LICENSE", "Cargo.toml"]

[features]
default = []
intl = [
    "dep:fixed_decimal",
    "dep:icu_calendar",
    "dep:icu_datetime",
    "dep:icu_decimal",
    "dep:icu_experimental",
    "dep:icu_locale_core",
    "dep:icu_plurals",
    "dep:icu_provider",
    "dep:icu_time",
    "dep:jiff",
    "dep:writeable",
]

[dependencies]
fixed_decimal = { version = "0.7", optional = true }
icu_calendar = { version = "2.3", optional = true }
icu_datetime = { version = "2.3", optional = true }
icu_decimal = { version = "2.3", optional = true }
icu_experimental = { version = "0.6", optional = true }
icu_locale_core = { version = "2.3", optional = true }
icu_plurals = { version = "2.3", optional = true }
# Its `logging` feature sends what ICU4X has to say about missing data to the
# `log` facade, which the application routes; without it, a debug build
# writes it to standard error.
icu_provider = { version = "2.3", optional = true, default-features = false, features = ["logging"] }
icu_time = { version = "2.3", optional = true }
jiff = { version = "0.2", optional = true, default-features = false, features = ["std", "tzdb-bundle-always"] }
writeable = { version = "0.6", optional = true }

[dev-dependencies]
curly-message-conformance = { path = "conformance" }
libtest-mimic = "0.8.2"

[[test]]
name = "conformance"
harness = false

[lints]
workspace = true

[package.metadata.docs.rs]
all-features = true

[workspace]
members = [".", "conformance"]
resolver = "3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
indexing_slicing = "deny"
string_slice = "deny"
arithmetic_side_effects = "deny"
non_ascii_literal = "deny"
print_stdout = "deny"
print_stderr = "deny"
dbg_macro = "deny"
